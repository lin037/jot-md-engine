name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public package version (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency: npm-publish

jobs:
  plan:
    name: Find a verified package for main
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact_id }}
      run_id: ${{ steps.package.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/find-editor-package.mjs "$RELEASE_VERSION"

  verify:
    name: Verify main when no matching package exists
    needs: plan
    if: needs.plan.outputs.artifact_id == ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.artifact_id != '' || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id || github.run_id }}
          artifact-ids: ${{ needs.plan.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          path: release
      - name: Check integrity and publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/publish-editor-package.mjs release "$RELEASE_VERSION"

  github-release:
    name: Publish GitHub Release
    needs: [plan, verify, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id || github.run_id }}
          artifact-ids: ${{ needs.plan.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          path: release
      - name: Attach the same package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/release/publish-github-release.sh "$RELEASE_VERSION"
