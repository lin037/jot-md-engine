name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public package version (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency: npm-publish

jobs:
  ci:
    name: Find verified main artifacts
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.ci.outputs.run }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch="$GITHUB_REF_NAME" -f event=push -f status=success \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "No successful main CI run for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish verified package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.ci.outputs.run }}
          name: jot-editor-package
          path: release
      - name: Check integrity and publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/publish-editor-package.mjs release "$RELEASE_VERSION"
