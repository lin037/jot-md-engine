name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          docs_only=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            docs_only=true
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/jot-changes"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CONTRIBUTING.md|docs/*|apps/demo/README.md|benchmarks/README.md|packages/editor/README.md|packages/editor-protocol/README.md) ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/jot-changes"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    name: Web and package
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm run test:ts
      - run: pnpm run typecheck
      - run: pnpm run package:verify --standalone
      - run: pnpm run benchmark:build
      - name: Upload editor package
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jot-editor-package
          path: dist/release/*.tgz
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.suite }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [demo, interaction, layout, quote]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm run test:browser ${{ matrix.suite }}
        env:
          JOT_DEMO_BROWSER_BASE: /jot-preview/
      - name: Upload Demo for Pages
        if: matrix.suite == 'demo' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_DEMO == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/demo

  pages:
    name: Deploy Demo
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_DEMO == 'true'
    needs: [rust, web, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
