name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          docs_only=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            docs_only=true
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/jot-changes"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|README.zh-CN.md|CONTRIBUTING.md|CONTRIBUTING.zh-CN.md|docs/*|\
                .github/ISSUE_TEMPLATE/*.md|.github/pull_request_template.md|\
                apps/*/README*.md|benchmarks/README*.md|crates/*/README*.md|packages/*/README*.md) ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/jot-changes"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    name: Web build and package
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm run test:ts
      - run: pnpm run typecheck
      - run: pnpm run package:verify
      - run: pnpm run benchmark:build
      - name: Upload editor package
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jot-editor-package
          path: dist/release/
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.suite }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [demo, interaction, layout, quote]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm run test:browser ${{ matrix.suite }}
        env:
          JOT_DEMO_BROWSER_BASE: /jot-preview/
      - name: Upload Demo for Pages
        if: matrix.suite == 'demo' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_DEMO == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/demo

  web_gate:
    # Keep the required check name configured on main.
    name: Web and package
    needs: [changes, web, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check package and browser results
        env:
          CLASSIFIED: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          WEB: ${{ needs.web.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "classification=$CLASSIFIED docs_only=$DOCS_ONLY web=$WEB browser=$BROWSER"
          case "$CLASSIFIED/$DOCS_ONLY" in
            success/true)  expected=skipped ;;
            success/false) expected=success ;;
            *) exit 1 ;;
          esac
          [[ "$WEB" == "$expected" && "$BROWSER" == "$expected" ]]

  pages:
    name: Deploy Demo
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_DEMO == 'true'
    needs: [rust, web_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.receipt.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
        continue-on-error: true
      - name: Confirm the deployment if its response was lost
        id: receipt
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for delay in 0 5 10; do
            sleep "$delay"
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq .status)
            echo "Pages deployment for $GITHUB_SHA reported $status"
            if [[ "$status" == "succeed" ]]; then
              url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
              echo "page_url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
